                  path: CML,
                  message: yUBXJ,
                  content: Buffer.from($ELXWC, 'utf8').toString('base64'),
                  branch: kvt,
                  sha: Fq,
                });
                core.info(`COMMIT_OK attempt=${sX} sha=${de.commit.sha} msg=${yUBXJ}`);
                return;
              } catch (EO) {
                jn = EO;
                if (EO.status === 409 && sX < 4) {
                  core.warning(`Conflict on attempt ${sX}, retrying...`);
                  await new Promise((r) => setTimeout(r, 1500 * sX));
                  continue;
                }
                throw EO;
              }
            }
            throw jn;
